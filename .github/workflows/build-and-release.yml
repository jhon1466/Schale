name: Build and Release Schale Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish self-contained Schale Server (win-x64)
        shell: pwsh
        run: |
          dotnet publish .\Schale-Server\Schale-Server.csproj -c Release -r win-x64 --self-contained true -o .\server-runtime
          Compress-Archive -Path .\server-runtime\* -DestinationPath .\Schale-Server-win-x64.zip -Force

      - name: Publish rolling latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Schale Latest Build
          make_latest: true
          files: |
            Schale-Server-win-x64.zip
